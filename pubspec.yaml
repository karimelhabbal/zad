name: zad
description: "زاد — رفيق الروح والمسير: القرآن الكريم، الأذكار، السبحة، مواقيت الصلاة والقبلة."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  provider: ^6.1.2

  # Local persistence
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4

  # Networking (recitation audio, prayer-time fallback)
  http: ^1.2.2

  # Font-based Mushaf rendering.
  #
  # `qcf_quran_plus` ships the King Fahd Complex QCF page fonts (one font per
  # page, 604 of them) plus the page data needed to lay out every line exactly
  # as printed. Text is drawn by the engine, so a page is sharp at any size and
  # no page image has to be shipped or downloaded.
  qcf_quran_plus: ^0.1.1
  # Required by `qcf_quran_plus` (its surah reader is built on it).
  scrollable_positioned_list: ^0.3.8

  # Quran recitation playback
  audioplayers: ^6.8.1

  # Location + sensors
  geolocator: ^13.0.2
  flutter_compass: ^0.8.1

  # Prayer time calculation (pure Dart, no paid service)
  adhan_dart: ^2.0.1

  # Sharing
  share_plus: ^10.1.2

  # Formatting / localization helpers (version pinned by flutter_localizations)
  intl: any
  flutter_local_notifications: ^22.3.2
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/data/

  fonts:
    # Classical / Quranic script
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700
    # Arabic UI (variable font — weights applied through fontVariations)
    - family: NotoNaskhArabic
      fonts:
        - asset: assets/fonts/NotoNaskhArabic.ttf
    # Latin UI
    - family: IBMPlexSans
      fonts:
        - asset: assets/fonts/IBMPlexSans.ttf
    # Latin headings
    - family: NotoSerif
      fonts:
        - asset: assets/fonts/NotoSerif.ttf
