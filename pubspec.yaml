name: zad
description: "زاد — رفيق الروح والمسير: القرآن الكريم، الأذكار، السبحة، مواقيت الصلاة والقبلة."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  provider: ^6.1.2

  # Local persistence
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4

  # Networking (Mushaf page assets)
  http: ^1.2.2

  # Quran recitation playback
  audioplayers: ^6.8.1

  # Location + sensors
  geolocator: ^13.0.2
  flutter_compass: ^0.8.1

  # Prayer time calculation (pure Dart, no paid service)
  adhan: ^2.0.0

  # Sharing
  share_plus: ^10.1.2

  # Formatting / localization helpers (version pinned by flutter_localizations)
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/data/

  fonts:
    # Classical / Quranic script
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700
    # Arabic UI (variable font — weights applied through fontVariations)
    - family: NotoNaskhArabic
      fonts:
        - asset: assets/fonts/NotoNaskhArabic.ttf
    # Latin UI
    - family: IBMPlexSans
      fonts:
        - asset: assets/fonts/IBMPlexSans.ttf
    # Latin headings
    - family: NotoSerif
      fonts:
        - asset: assets/fonts/NotoSerif.ttf
