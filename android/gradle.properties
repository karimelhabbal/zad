# The Flutter template default here is "-Xmx8G -XX:MaxMetaspaceSize=4G". That
# request is larger than the free RAM on this machine, so the Gradle daemon was
# killed mid-build ("Gradle build daemon disappeared unexpectedly"). The values
# below build reliably; raise them again only if you have the headroom.
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=1024m -XX:ReservedCodeCacheSize=256m
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
